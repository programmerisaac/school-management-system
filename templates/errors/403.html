{% extends 'base.html' %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-50">
    <div class="text-center">
        <h1 class="text-9xl font-bold text-red-600">403</h1>
        <h2 class="text-4xl font-bold text-gray-900 mt-4">Access Denied</h2>
        <p class="text-xl text-gray-600 mt-4 mb-8">
            You don't have permission to access this page.
        </p>
        <div class="flex items-center justify-center space-x-4">
            <a href="javascript:history.back()" class="px-6 py-3 rounded-lg border-2 font-medium hover:bg-gray-50" style="border-color: {{ primary_color }}; color: {{ primary_color }};">
                Go Back
            </a>
            <a href="{% url 'core:dashboard' %}" class="px-6 py-3 rounded-lg text-white font-medium hover:opacity-90" style="background-color: {{ primary_color }};">
                Go to Dashboard
            </a>
        </div>
    </div>
</div>
{% endblock %}
